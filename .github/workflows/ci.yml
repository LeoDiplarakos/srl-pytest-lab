name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v 0.83.0

      - name: Deploy lab
        run: sudo containerlab deploy -t lab/srl-lab.clab.yml

      - name: Wait for gNMI
        run: |
          for i in $(seq 1 30); do
            pytest -m smoke -q && exit 0
            sleep 10
          done
          exit 1

      - name: Safe tests
        run: pytest --junitxml=report-safe.xml

      - name: Disruptive tests
        run: pytest -m disruptive --junitxml=report-disruptive.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: report-*.xml

      - name: Destroy lab
        if: always()
        run: sudo containerlab destroy -t lab/srl-lab.clab.yml --cleanup
