name: srl-lab
topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2
  nodes:
    srl1:
      kind: nokia_srlinux
      startup-config: configs/srl1.cli
      mgmt-ipv4: 172.20.20.2
    srl2:
      kind: nokia_srlinux
      startup-config: configs/srl2.cli
      mgmt-ipv4: 172.20.20.3
    srl3:
      kind: nokia_srlinux
      startup-config: configs/srl3.cli
      mgmt-ipv4: 172.20.20.4
  links:
    - endpoints: ["srl1:ethernet-1/1", "srl2:ethernet-1/1"]
    - endpoints: ["srl2:ethernet-1/2", "srl3:ethernet-1/1"]
    - endpoints: ["srl1:ethernet-1/2", "srl3:ethernet-1/2"]
